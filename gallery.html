<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Miles of Smiles Montessori</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div id="header-placeholder"></div>

  <main>
    <section>
      <h1>Gallery</h1>
      <div class="gallery" id="galleryGrid">
        <!-- Images will be populated here -->
        <img src="images/miles-of-smiles-100.JPG" alt="Gallery Image 1" class="gallery-img">
        <img src="images/miles-of-smiles-101.JPG" alt="Gallery Image 2" class="gallery-img">
        <img src="images/miles-of-smiles-102.JPG" alt="Gallery Image 3" class="gallery-img">
        <img src="images/miles-of-smiles-103.JPG" alt="Gallery Image 4" class="gallery-img">
        <img src="images/miles-of-smiles-104.JPG" alt="Gallery Image 5" class="gallery-img">
        <img src="images/miles-of-smiles-105.JPG" alt="Gallery Image 6" class="gallery-img">
        <img src="images/miles-of-smiles-106.JPG" alt="Gallery Image 7" class="gallery-img">
        <img src="images/miles-of-smiles-107.JPG" alt="Gallery Image 8" class="gallery-img">
        <img src="images/miles-of-smiles-108.JPG" alt="Gallery Image 9" class="gallery-img">
        <img src="images/miles-of-smiles-109.JPG" alt="Gallery Image 10" class="gallery-img">
        <img src="images/miles-of-smiles-110.JPG" alt="Gallery Image 11" class="gallery-img">
        <img src="images/miles-of-smiles-111.JPG" alt="Gallery Image 12" class="gallery-img">
      </div>
    </section>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
      <span class="close">&times;</span>
      <img class="lightbox-content" id="lightbox-img">
    </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="script.js?v=cleanup"></script>
</body>

</html>
