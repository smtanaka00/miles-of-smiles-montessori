<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Miles of Smiles Montessori</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div id="header-placeholder"></div>

  <section>
    <h1>Contact & Registration</h1>
    <p>25A Herbert Chitepo Street, Bulawayo</p>
    <p>+263 29 882 275 or +263 78 553 6660</p>
    <p><a href="https://www.facebook.com/share/1GpRpe1Vyj/?mibextid=wwXIfr" target="_blank">Visit our Facebook page</a>
    </p>
    <div class="two-col">
      <form id="regForm">
        <h3>Register Interest</h3>
        <label>Parent Name<input required /></label>
        <label>Child Name<input required /></label>
        <label>Child Age<input required /></label>
        <label>Preferred Start Date<input type="date" /></label>
        <label>Contact Details<input required /></label>
        <button type="submit">Submit</button>
        <div class="thank-you">Thank you for your interest.</div>
      </form>
      <form id="callbackForm">
        <h3>Request a Callback</h3>
        <label>Name<input required /></label>
        <label>Phone<input required /></label>
        <button type="submit">Call Me</button>
        <div class="thank-you">We will call you soon.</div>
      </form>
    </div>
    <form id="newsForm">
      <h3>Newsletter Signup</h3>
      <label>Email<input type="email" required /></label>
      <button type="submit">Subscribe</button>
      <div class="thank-you">You’re subscribed.</div>
    </form>
  </section>

  <div id="footer-placeholder"></div>

  <script src="script.js?v=cleanup"></script>
</body>

</html>
