<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Tour | Miles of Smiles Montessori</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div id="header-placeholder"></div>

  <section>
    <h1>Request a School Tour</h1>
    <p>We love welcoming families to see our classrooms, meet our teachers, and experience Montessori in action.</p>
    <form id="tourForm">
      <label>Name<input required /></label>
      <label>Email<input type="email" required /></label>
      <label>Phone<input required /></label>
      <label>Child’s Age<input required /></label>
      <label>Preferred Day<textarea rows="2"></textarea></label>
      <label>Message<textarea rows="3"></textarea></label>
      <button type="submit">Send Request</button>
      <div class="thank-you">Thank you, we will contact you to confirm your visit.</div>
    </form>
  </section>

  <div id="footer-placeholder"></div>

  <script src="script.js?v=cleanup"></script>
</body>

</html>
